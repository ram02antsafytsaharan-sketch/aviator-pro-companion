name: Build AVIATOR PRO APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract Android project
        run: |
          ZIP_FILE="./AviatorProCompanion(1).zip"
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          GRADLEW=$(find extracted -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "Gradle wrapper not found"
            exit 1
          fi
          chmod +x "$GRADLEW"
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: AVIATOR-PRO-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
